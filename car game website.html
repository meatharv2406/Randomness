<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NitroBoost Web Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            width: 800px;
            height: 600px;
            max-width: 100vw;
            max-height: 75vh;
        }
        canvas {
            display: block;
            background-color: #222;
            width: 100%;
            height: 100%;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid #ff3333;
            font-family: monospace;
            font-size: 14px;
            pointer-events: none;
            line-height: 1.4;
            z-index: 10;
        }
        .stat-val {
            color: #00ffcc;
            font-weight: bold;
        }
        
        /* Touch Controls Layer */
        #touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 10px 20px;
            margin-top: 10px;
        }
        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .btn {
            background: #2a2a2a;
            color: white;
            border: 2px solid #444;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        .btn:active {
            background: #ff3333;
            border-color: #ff6666;
        }
        .btn-rect {
            border-radius: 8px;
            width: 75px;
            height: 50px;
            font-size: 14px;
        }
        .btn-nitro {
            background: #9b59b6;
            border-color: #8e44ad;
        }
        .btn-nitro:active {
            background: #e74c3c;
        }
        
        /* Hide touch controls entirely if someone plays on a desktop computer */
        @media (hover: hover) and (pointer: fine) {
            #touch-controls {
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud">
            <div>GEAR: <span id="hud-gear" class="stat-val">0</span> / 7</div>
            <div>SPEED: <span id="hud-speed" class="stat-val">0.00</span></div>
            <div>MAX SPEED: <span id="hud-max" class="stat-val">0</span></div>
        </div>
    </div>

    <!-- Touch Control Interface Layout -->
    <div id="touch-controls">
        <!-- Steering Group (Left Side) -->
        <div class="control-group">
            <button class="btn" id="btn-left">◀</button>
            <button class="btn" id="btn-right">▶</button>
        </div>
        
        <!-- Gears & Nitro (Middle) -->
        <div class="control-group">
            <button class="btn btn-rect" id="btn-down">GEAR -</button>
            <button class="btn btn-rect btn-nitro" id="btn-nitro">NITRO</button>
            <button class="btn btn-rect" id="btn-up">GEAR +</button>
        </div>
        
        <!-- Pedals Group (Right Side) -->
        <div class="control-group">
            <button class="btn" id="btn-reverse">S</button>
            <button class="btn" id="btn-drive">W</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const hudGear = document.getElementById('hud-gear');
        const hudSpeed = document.getElementById('hud-speed');
        const hudMax = document.getElementById('hud-max');

        // =====================
        // LOAD GAME IMAGES
        // =====================
        const trackImage = new Image();
        trackImage.src = 'Racing Track.png'; 

        const carImage = new Image();
        carImage.src = 'CAR.png'; 

        // =====================
        // CAR & GAME VARIABLES
        // =====================
        let gear = 0;
        const maxgear = 7;
        const mingear = 0;
        
        let car_x = 400;
        let car_y = 267;
        let angle = 0; 
        let speed = 0;

        const acceleration = 8.50;
        let max_forward_speed = 0;
        const max_reverse_speed = 2;
        const friction = 0.75;

        // Unified control state for both keyboard and touch
        const controls = {
            forward: false,
            reverse: false,
            left: false,
            right: false,
            nitro: false
        };

        // =====================
        // KEYBOARD LISTENERS
        // =====================
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') controls.forward = true;
            if (e.key === 's' || e.key === 'S') controls.reverse = true;
            if (e.key === 'a' || e.key === 'A') controls.left = true;
            if (e.key === 'd' || e.key === 'D') controls.right = true;
            if (e.key === ' ') controls.nitro = true;
            
            if (e.key === 'ArrowUp') shiftGear(1);
            if (e.key === 'ArrowDown') shiftGear(-1);
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') controls.forward = false;
            if (e.key === 's' || e.key === 'S') controls.reverse = false;
            if (e.key === 'a' || e.key === 'A') controls.left = false;
            if (e.key === 'd' || e.key === 'D') controls.right = false;
            if (e.key === ' ') controls.nitro = false;
        });

        // =====================
        // TOUCH LISTENERS
        // =====================
        function setupTouchBtn(id, property) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); controls[property] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); controls[property] = false; });
        }

        setupTouchBtn('btn-drive', 'forward');
        setupTouchBtn('btn-reverse', 'reverse');
        setupTouchBtn('btn-left', 'left');
        setupTouchBtn('btn-right', 'right');
        setupTouchBtn('btn-nitro', 'nitro');

        // Gear shifts trigger immediately on touch tap
        document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); shiftGear(1); });
        document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); shiftGear(-1); });

        function shiftGear(direction) {
            gear += direction;
            if (gear > maxgear) gear = maxgear;
            if (gear < mingear) gear = mingear;
        }

        // =====================
        // RENDER IMAGE CAR
        // =====================
        function drawCar(x, y, degrees) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-degrees * Math.PI / 180); 

            if (carImage.complete) {
                ctx.drawImage(carImage, -10, -5, 20, 10);
            }
            ctx.restore();
        }

        // =====================
        // GAME PHYSICS LOOP
        // =====================
        function gameLoop() {
            if (controls.forward) speed += acceleration;
            if (controls.reverse) speed -= acceleration;

            if (Math.abs(speed) >= 2) {
                if (controls.left) angle += 13;
                if (controls.right) angle -= 13;
            }

            if (controls.nitro) speed *= 1.5;

            switch(gear) {
                case 0: max_forward_speed = 0; break;
                case 1: max_forward_speed = 20; break;
                case 2: max_forward_speed = 40; break;
                case 3: max_forward_speed = 60; break;
                case 4: max_forward_speed = 80; break;
                case 5: max_forward_speed = 100; break;
                case 6: max_forward_speed = 120; break;
                case 7: max_forward_speed = 300; break;
            }

            if (speed > max_forward_speed) speed = max_forward_speed;
            if (speed < -max_reverse_speed) speed = -max_reverse_speed;

            speed *= friction;

            const radians = angle * Math.PI / 180;
            car_x += speed * Math.cos(radians);
            car_y -= speed * Math.sin(radians);

            if (car_x > canvas.width) car_x = 0;
            if (car_x < 0) car_x = canvas.width;
            if (car_y > canvas.height) car_y = 0;
            if (car_y < 0) car_y = canvas.height;

            hudGear.textContent = gear;
            hudSpeed.textContent = speed.toFixed(2);
            hudMax.textContent = max_forward_speed;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (trackImage.complete) {
                ctx.drawImage(trackImage, 0, 0, canvas.width, canvas.height);
            }
